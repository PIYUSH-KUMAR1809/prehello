version: 2
# One monthly PR for everything, so there is at most one Dependabot branch at a time.
multi-ecosystem-groups:
  all-updates:
    schedule:
      interval: monthly
updates:
  - package-ecosystem: npm
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-updates
    open-pull-requests-limit: 1
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-updates
    open-pull-requests-limit: 1
