# CI for prehello: Linux, macOS and Windows, Node 18 / 20 / 22.
#
# This file is the FIRST real run of the test suite on Windows and macOS: until it has gone green once, Windows and macOS
# support is "verified by simulation", not "verified".
#
# Windows notes
#  * The suite spawns the built CLI (dist/cli.js) with a hermetic HOME/USERPROFILE; no step needs admin rights.
#  * Symlink tests need the symlink privilege. GitHub's windows runners have it; on a developer laptop without Developer
#    Mode those tests skip themselves (or fail with EPERM at fixture creation: enable Developer Mode).
#  * .gitattributes pins every text file to LF so goldens compare byte-for-byte; goldens are also compared CRLF-insensitively.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          # one reproducible clock for every machine
          TZ: UTC
      - name: Install smoke test (pack, install without the optional PNG engine, PNG message, then with it)
        run: node scripts/smoke-install.mjs
      - name: Windows PowerShell smoke (cmd shim + redirection)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Native commands do not stop a pwsh script when they fail: check every exit code ourselves.
          $ErrorActionPreference = 'Stop'
          function Run-Native([scriptblock]$cmd, [int[]]$ok = @(0)) {
            & $cmd
            if ($ok -notcontains $LASTEXITCODE) { throw "exit code $LASTEXITCODE from: $cmd" }
          }
          $work = Join-Path $env:RUNNER_TEMP ("ps-smoke-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force $work | Out-Null
          $packed = npm pack --pack-destination $work --silent
          if ($LASTEXITCODE -ne 0) { throw 'npm pack failed' }
          $tgz = Join-Path $work (($packed | Select-Object -Last 1).Trim())
          if (-not (Test-Path -LiteralPath $tgz)) { throw "tarball not found: $tgz" }
          $app = Join-Path $work 'app'
          New-Item -ItemType Directory -Force $app | Out-Null
          Set-Location $app
          Run-Native { npm init -y | Out-Null }
          Run-Native { npm install $tgz --no-audit --no-fund }
          # exit 3 = the report has warnings (the runner's real home may trigger some): fine here, a crash is not
          Run-Native { npx --no-install prehello --version }
          Run-Native { npx --no-install prehello --markdown=report.md } @(0, 3)
          if (-not (Test-Path report.md)) { throw 'report.md not written' }
          Run-Native { npx --no-install prehello --json=report.json } @(0, 3)
          if (-not (Test-Path report.json)) { throw 'report.json not written' }
          $null = Get-Content report.json -Raw | ConvertFrom-Json
          Write-Host 'PowerShell smoke ok'
